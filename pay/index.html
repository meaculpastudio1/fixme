<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Φτιάξε Με · Πληρωμή</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #14121A; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 420px; width: 100%; }
  .mark {
    width: 84px; height: 84px; margin: 0 auto 22px;
    border-radius: 26px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #FF3D77 0%, #8A2BE2 50%, #2D6CFF 100%);
    font-size: 40px; font-weight: 800; color: #fff;
  }
  h1 { font-size: 24px; margin: 0 0 10px; font-weight: 800; }
  p  { font-size: 16px; line-height: 1.5; color: #B9B4C7; margin: 0 0 26px; }
  .btn {
    display: block; width: 100%; padding: 15px 20px;
    border: 0; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #FF3D77 0%, #8A2BE2 50%, #2D6CFF 100%);
    color: #fff; font-size: 17px; font-weight: 800; text-decoration: none;
  }
  .hint { margin-top: 18px; font-size: 13px; color: #6B6780; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Φ</div>
    <h1 id="title">Ολοκληρώθηκε</h1>
    <p id="msg">Ανοίγω την εφαρμογή…</p>
    <a class="btn" id="openBtn" href="#">Άνοιγμα «Φτιάξε Με»</a>
    <div class="hint">Αν δεν ανοίξει μόνη της, πάτα το κουμπί ή γύρνα στην εφαρμογή.</div>
  </div>

<script>
(function () {
  // ─────────────────────────────────────────────────────────────────────
  // Σελίδα επιστροφής πληρωμής — ΑΠΟΚΛΕΙΣΤΙΚΑ για το «Φτιάξε Με»
  // (com.meaculpastudio.fixme).  Στέλνει στο  fixme://pay
  //
  // ΜΗΝ τη μπερδέψεις με το  meaculpastudio1.github.io/pay/  που ανήκει
  // στο Lantern Light και στέλνει στο  lanternai://pay
  // ─────────────────────────────────────────────────────────────────────

  var params = new URLSearchParams(window.location.search);
  var status = params.get('status') === 'cancel' ? 'cancel' : 'ok';

  if (status === 'cancel') {
    document.getElementById('title').textContent = 'Η πληρωμή ακυρώθηκε';
    document.getElementById('msg').textContent   = 'Δεν χρεώθηκες. Μπορείς να ξαναπροσπαθήσεις όποτε θες.';
  } else {
    document.getElementById('title').textContent = 'Ευχαριστούμε!';
    document.getElementById('msg').textContent   = 'Η πληρωμή ολοκληρώθηκε. Ανοίγω την εφαρμογή…';
  }

  var deepLink = 'fixme://pay?status=' + status;
  document.getElementById('openBtn').setAttribute('href', deepLink);

  // Μικρή καθυστέρηση: αλλιώς κάποια κινητά μπλοκάρουν το redirect
  // επειδή δεν έχει προλάβει να ζωγραφιστεί η σελίδα.
  setTimeout(function () {
    window.location.href = deepLink;
  }, 600);
})();
</script>
</body>
</html>
